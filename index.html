<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Download maniger</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Downloads">
<style>
:root {
  --bg: #f4f6fb; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
  --accent: #2563eb; --accent-text: #ffffff; --ok: #16a34a; --bad: #dc2626; --warn: #d97706;
  --bar: #e5e7eb; --chip: #eef2ff; --chip-text: #3730a3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1020; --card: #151b2e; --text: #e5e7eb; --muted: #9ca3af; --line: #263049;
    --accent: #3b82f6; --bar: #263049; --chip: #1e2a4a; --chip-text: #c7d2fe;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, Arial, sans-serif; }
body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.wrap { max-width: 760px; margin: 0 auto; padding: 12px 16px 48px; }
header { display: flex; align-items: center; gap: 10px; padding: 6px 0 12px; }
header h1 { font-size: 20px; margin: 0; flex: 1; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 10px; padding: 8px 12px; cursor: pointer; text-decoration: none; display: inline-flex;
  align-items: center; gap: 6px; min-height: 40px; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.small, .btn.small { min-height: 34px; padding: 4px 10px; font-size: 14px; }
button:disabled { opacity: .5; cursor: default; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
textarea, input, select { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); }
textarea { min-height: 76px; resize: vertical; }
label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: 1; min-width: 240px; }
.seg button { border: 0; border-radius: 0; flex: 1; min-height: 40px; padding: 6px 4px; font-size: 14px; }
.seg button + button { border-inline-start: 1px solid var(--line); }
.seg button.on { background: var(--chip); color: var(--chip-text); font-weight: 600; }
.tabs { display: flex; gap: 8px; margin: 18px 0 10px; }
.tabs button { flex: 1; }
.tabs button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.item { padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 0; }
.name { font-weight: 600; word-break: break-word; }
.meta { color: var(--muted); font-size: 14px; display: flex; gap: 6px 10px; flex-wrap: wrap; margin-top: 2px; }
.chip { background: var(--chip); color: var(--chip-text); border-radius: 999px; padding: 0 8px; font-size: 13px; }
.bar { height: 8px; background: var(--bar); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.bar.indet > i { width: 30%; animation: slide 1.2s infinite ease-in-out; }
@keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
.status-error { color: var(--bad); } .status-done { color: var(--ok); } .status-paused { color: var(--warn); }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.hidden { display: none !important; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; max-width: calc(100% - 32px);
  font-size: 15px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 10; }
#toast.show { opacity: 1; }
.note { font-size: 14px; color: var(--muted); }
.warn { color: var(--warn); }
.filters { display: flex; gap: 8px; margin-bottom: 10px; }
.filters input { flex: 1; } .filters select { width: auto; }
code { background: var(--bg); padding: 1px 5px; border-radius: 6px; font-size: 14px; }
.person { font-weight: 600; }
.people { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.people button { border-radius: 999px; }
.people button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
[dir="rtl"] body, [dir="rtl"] input, [dir="rtl"] textarea, [dir="rtl"] select, [dir="rtl"] button {
  font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", "Geeza Pro", system-ui, sans-serif; }
#urls { direction: ltr; text-align: start; }
</style>
<script src="lib/jszip.min.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i18n="app">Download maniger</h1>
    <button id="langBtn" class="small" aria-label="Language">ع</button>
    <button id="personBtn" class="small person hidden">👤 <span id="personName"></span></button>
  </header>

  <!-- Who is using this device -->
  <section class="card hidden" id="whoCard">
    <strong data-i18n="whoTitle"></strong>
    <div class="people" id="peopleList"></div>
    <div class="row">
      <input id="newPerson" type="text" maxlength="40" data-i18n-ph="newPersonPh" style="flex:1;min-width:160px">
      <button id="addPerson" class="primary" data-i18n="addPerson"></button>
    </div>
  </section>

  <!-- Add -->
  <section class="card" id="addCard">
    <label for="urls" style="margin-top:0" data-i18n="pasteLabel"></label>
    <textarea id="urls" placeholder="https://..." autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    <div class="row end" style="margin-top:10px">
      <button id="pasteBtn" data-i18n="paste"></button>
      <button id="addBtn" class="primary" data-i18n="download"></button>
    </div>
    <p class="note" data-i18n="help"></p>
  </section>

  <div class="tabs">
    <button id="tabActive" class="on"><span data-i18n="tabActive"></span> <span id="activeCount"></span></button>
    <button id="tabHistory" data-i18n="tabHistory"></button>
  </div>

  <section class="card" id="activeList"></section>

  <section id="historyBox" class="hidden">
    <div class="filters">
      <input id="search" type="search" data-i18n-ph="search">
      <select id="who"></select>
    </div>
    <div class="card" id="historyList"></div>
    <div class="row end"><button id="clearHistory" class="small" data-i18n="clearAll"></button></div>
  </section>
</div>
<div id="toast" role="status"></div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("dm." + k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("dm." + k, v); } catch (e) {} },
    getJSON(k, d) { try { return JSON.parse(this.get(k, "")) || d; } catch (e) { return d; } },
    setJSON(k, v) { this.set(k, JSON.stringify(v)); },
  };

  // ---------- translations
  const T = {
    en: {
      app: "Download maniger",
      whoTitle: "Who is using this device?", newPersonPh: "New name", addPerson: "Add",
      pasteLabel: "Paste one or more links (one per line)",
      paste: "📋 Paste", download: "⬇️ Download",
      help: "Files are saved straight to this device. Works with direct links (zip, exe, photos, PDF, MP3, MP4…) and GitHub files, folders and repos. Video links (YouTube, Pinterest, Instagram, TikTok…) open in cobalt.tools, a free website that saves the video to your device.",
      tabActive: "Downloading", tabHistory: "History", search: "Search history", everyone: "Everyone",
      nothingActive: "Nothing downloading right now.", noHistory: "No downloads yet.", noMatch: "Nothing matches.",
      of: "{a} of {b}", starting: "Starting…", zipping: "Making zip…", files: "{a} of {b} files",
      cancel: "✖ Cancel",
      done: "✓ Saved", handed: "↗ Browser download", failed: "✗ Failed",
      handedNote: "This site doesn't allow in-page downloads, so your browser's own downloader took over. Check your Downloads (on iPhone: Files app). If nothing happened, tap Open download.",
      openBrowser: "↗ Open download",
      again: "⬇️ Download again", copy: "🔗 Copy link", forget: "🗑 Remove",
      clearAll: "Clear all history", clearQ: "Clear the whole history on this device?",
      linkCopied: "Link copied", pasteFirst: "Paste a link first.", pasteManual: "Long-press the box and choose Paste.",
      notLink: "Not a link: {u}", videoSite: "Opening cobalt.tools to save the video. The link is also copied in case you need to paste it there.",
      cobalt: "🎬 Download with cobalt", viaCobalt: "↗ Sent to cobalt", cobaltNote: "Video links are downloaded by cobalt.tools. If its page didn't open, tap the button.",
      pickWho: "Choose who you are first.",
      ghLimit: "GitHub limit reached (60 folder lookups per hour). Try again later.",
      ghNotFound: "GitHub folder not found (is the repository private?)", ghEmpty: "That GitHub folder is empty.",
      ghFolder: "{n} (GitHub folder, {c} files)", cancelled: "Cancelled",
    },
    ar: {
      app: "مدير التنزيلات",
      whoTitle: "من يستخدم هذا الجهاز؟", newPersonPh: "اسم جديد", addPerson: "إضافة",
      pasteLabel: "الصق رابطاً أو أكثر (رابط في كل سطر)",
      paste: "📋 لصق", download: "⬇️ تنزيل",
      help: "تُحفظ الملفات مباشرة على هذا الجهاز. يعمل مع الروابط المباشرة (zip و exe والصور و PDF و MP3 و MP4…) وملفات ومجلدات ومستودعات GitHub. روابط الفيديو (يوتيوب، بنترست، إنستغرام، تيك توك…) تُفتح في موقع cobalt.tools المجاني الذي يحفظ الفيديو على جهازك.",
      tabActive: "قيد التنزيل", tabHistory: "السجل", search: "ابحث في السجل", everyone: "الجميع",
      nothingActive: "لا يوجد شيء قيد التنزيل الآن.", noHistory: "لا توجد تنزيلات بعد.", noMatch: "لا توجد نتائج.",
      of: "{a} من {b}", starting: "جارٍ البدء…", zipping: "جارٍ إنشاء ملف zip…", files: "{a} من {b} ملفات",
      cancel: "✖ إلغاء",
      done: "✓ تم الحفظ", handed: "↗ تنزيل المتصفح", failed: "✗ فشل",
      handedNote: "هذا الموقع لا يسمح بالتنزيل داخل الصفحة، لذلك تولّى متصفحك التنزيل. تحقق من التنزيلات (على iPhone: تطبيق الملفات). إذا لم يحدث شيء، اضغط فتح التنزيل.",
      openBrowser: "↗ فتح التنزيل",
      again: "⬇️ تنزيل مرة أخرى", copy: "🔗 نسخ الرابط", forget: "🗑 حذف",
      clearAll: "مسح السجل كله", clearQ: "مسح السجل كله على هذا الجهاز؟",
      linkCopied: "تم نسخ الرابط", pasteFirst: "الصق رابطاً أولاً.", pasteManual: "اضغط مطولاً على المربع واختر لصق.",
      notLink: "ليس رابطاً: {u}", videoSite: "جارٍ فتح cobalt.tools لحفظ الفيديو. تم نسخ الرابط أيضاً إذا احتجت لصقه هناك.",
      cobalt: "🎬 تنزيل عبر cobalt", viaCobalt: "↗ أُرسل إلى cobalt", cobaltNote: "روابط الفيديو تُنزَّل عبر cobalt.tools. إذا لم تُفتح صفحته، اضغط الزر.",
      pickWho: "اختر من أنت أولاً.",
      ghLimit: "تم الوصول إلى حد GitHub (60 طلباً في الساعة). حاول لاحقاً.",
      ghNotFound: "لم يتم العثور على مجلد GitHub (هل المستودع خاص؟)", ghEmpty: "مجلد GitHub هذا فارغ.",
      ghFolder: "{n} (مجلد GitHub، {c} ملفات)", cancelled: "أُلغي",
    },
  };
  let lang = store.get("lang", (navigator.language || "en").toLowerCase().startsWith("ar") ? "ar" : "en");
  function t(key, vars) {
    let s = (T[lang] && T[lang][key]) || T.en[key] || key;
    if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
    return s;
  }

  // ---------- state (everything lives on this device)
  let people = store.getJSON("people", []);
  let user = store.get("user", "");
  let history = store.getJSON("history", []);
  const jobs = new Map(); // id -> job
  let tab = "active";
  const saveHistory = () => store.setJSON("history", history.slice(0, 1000));

  // ---------- helpers
  function toast(msg) {
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove("show"), 4000);
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  const bdi = (s) => `<bdi>${esc(s)}</bdi>`;
  function size(n) {
    if (!n) return "";
    const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return n.toFixed(n < 10 && i ? 1 : 0) + " " + u[i];
  }
  function when(ts) {
    const d = new Date(ts), now = new Date(), loc = lang === "ar" ? "ar-IQ" : undefined;
    return d.toDateString() === now.toDateString()
      ? d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" })
      : d.toLocaleDateString(loc, { day: "numeric", month: "short", year: d.getFullYear() === now.getFullYear() ? undefined : "numeric" });
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const KIND = { file: "📦", github: "📁", video: "🎬" };

  const VIDEO_SITES = ["youtube.com", "youtu.be", "instagram.com", "tiktok.com", "facebook.com", "fb.watch",
    "twitter.com", "x.com", "vimeo.com", "dailymotion.com", "twitch.tv", "soundcloud.com", "snapchat.com", "threads.net",
    "pinterest.com", "pin.it", "reddit.com", "bilibili.com", "tumblr.com", "bsky.app", "streamable.com", "ok.ru", "vk.com", "rutube.ru", "loom.com"];
  const cobaltUrl = (u) => "https://cobalt.tools/#" + encodeURIComponent(u); // cobalt fills the box and starts saving
  function openCobalt(u) {
    try { navigator.clipboard.writeText(u).catch(() => {}); } catch (e) {}
    window.open(cobaltUrl(u), "_blank", "noopener");
  }
  function hostOf(u) { try { return new URL(u).hostname.toLowerCase(); } catch (e) { return ""; } }
  const isVideoSite = (u) => { const h = hostOf(u); return VIDEO_SITES.some((s) => h === s || h.endsWith("." + s)); };

  function nameFromUrl(u) {
    try {
      const p = new URL(u).pathname.split("/").filter(Boolean).pop();
      return p ? decodeURIComponent(p) : new URL(u).hostname;
    } catch (e) { return "download"; }
  }
  function nameFromHeaders(res, fallback) {
    const cd = res.headers.get("Content-Disposition") || "";
    let m = cd.match(/filename\*=UTF-8''([^;]+)/i);
    if (m) { try { return decodeURIComponent(m[1].replace(/"/g, "")); } catch (e) {} }
    m = cd.match(/filename="?([^";]+)"?/i);
    return m ? m[1] : fallback;
  }
  function saveBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  function handOff(url) {
    // Let the browser's own downloader fetch it (works for any site, big files, resumes)
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener"; a.setAttribute("download", "");
    document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------- GitHub (like DownGit)
  const GH_RE = /^https?:\/\/(?:www\.)?github\.com\/([^/?#]+)\/([^/?#]+?)(?:\.git)?(?:\/(tree|blob)\/([^?#]+?))?\/?(?:[?#].*)?$/i;
  function github(u) { const m = u.match(GH_RE); return m ? { owner: m[1], repo: m[2], kind: m[3] || "", rest: m[4] || "" } : null; }

  // ---------- downloads
  const MAX_IN_PAGE = 700 * 1024 * 1024; // bigger files go to the browser's own downloader

  function finish(job, status, extra) {
    jobs.delete(job.id);
    if (status !== "cancelled") {
      history.unshift(Object.assign({ id: job.id, kind: job.kind, name: job.name, url: job.url, user: job.user,
        status, size: job.done || job.total || 0, time: Date.now() }, extra || {}));
      saveHistory();
    }
    render();
  }

  async function downloadFile(job, url) {
    let res;
    try {
      res = await fetch(url, { signal: job.ctrl.signal, mode: "cors", credentials: "omit", referrerPolicy: "no-referrer" });
    } catch (e) {
      if (job.ctrl.signal.aborted) return finish(job, "cancelled");
      handOff(url); return finish(job, "handed", { directUrl: url }); // blocked by the site (no CORS): browser takes over
    }
    if (!res.ok) return finish(job, "error", { error: "HTTP " + res.status });
    job.total = +res.headers.get("Content-Length") || 0;
    job.name = nameFromHeaders(res, job.name);
    if (job.total > MAX_IN_PAGE || !res.body) { job.ctrl.abort(); handOff(url); return finish(job, "handed", { directUrl: url }); }
    const reader = res.body.getReader(), chunks = [];
    let last = Date.now(), lastBytes = 0;
    try {
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value); job.done += value.length;
        const now = Date.now();
        if (now - last > 700) { job.speed = (job.done - lastBytes) / ((now - last) / 1000); last = now; lastBytes = job.done; render(); }
        if (job.done > MAX_IN_PAGE) { job.ctrl.abort(); handOff(url); return finish(job, "handed", { directUrl: url }); }
      }
    } catch (e) {
      if (job.ctrl.signal.aborted) return finish(job, "cancelled");
      return finish(job, "error", { error: String(e.message || e) });
    }
    saveBlob(new Blob(chunks, { type: res.headers.get("Content-Type") || "application/octet-stream" }), job.name);
    finish(job, "done");
  }

  async function ghJSON(url, signal) {
    const r = await fetch(url, { signal, headers: { Accept: "application/vnd.github+json" } });
    if (r.status === 403 || r.status === 429) throw new Error(t("ghLimit"));
    if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
    return r.json();
  }

  async function downloadGithubFolder(job, g) {
    const signal = job.ctrl.signal;
    try {
      const parts = g.rest.split("/").filter(Boolean).map(decodeURIComponent);
      let tree = null, ref = "", folder = "";
      for (let i = 1; i <= Math.min(parts.length, 4); i++) { // branch names can contain "/"
        ref = parts.slice(0, i).join("/");
        try {
          tree = await ghJSON(`https://api.github.com/repos/${g.owner}/${g.repo}/git/trees/${encodeURIComponent(ref)}?recursive=1`, signal);
          folder = parts.slice(i).join("/"); break;
        } catch (e) { if (e.status !== 404 && e.status !== 422) throw e; }
      }
      if (!tree) throw new Error(t("ghNotFound"));
      const prefix = folder ? folder + "/" : "";
      const blobs = tree.tree.filter((e) => e.type === "blob" && e.path.startsWith(prefix));
      if (!blobs.length) throw new Error(t("ghEmpty"));
      const base = (folder ? folder.split("/").pop() : g.repo).replace(/[<>:"/\\|?*]/g, "_");
      job.name = base + ".zip";
      job.label = t("ghFolder", { n: base, c: blobs.length });
      job.total = blobs.reduce((s, e) => s + (e.size || 0), 0);
      job.filesTotal = blobs.length; job.filesDone = 0;
      render();
      const zip = new JSZip(), root = zip.folder(base);
      const queue = blobs.slice();
      const enc = (p) => p.split("/").map(encodeURIComponent).join("/");
      async function worker() {
        while (queue.length) {
          const e = queue.shift();
          const r = await fetch(`https://raw.githubusercontent.com/${g.owner}/${g.repo}/${enc(ref)}/${enc(e.path)}`, { signal });
          if (!r.ok) throw new Error("HTTP " + r.status + ": " + e.path);
          const buf = await r.arrayBuffer();
          root.file(e.path.slice(prefix.length), buf);
          job.done += buf.byteLength; job.filesDone++; render();
        }
      }
      await Promise.all(Array.from({ length: 6 }, worker));
      job.zipping = true; render();
      const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } });
      if (signal.aborted) return finish(job, "cancelled");
      saveBlob(blob, job.name);
      job.done = blob.size;
      finish(job, "done", { name: job.label });
    } catch (e) {
      if (signal.aborted) return finish(job, "cancelled");
      finish(job, "error", { error: String(e.message || e), name: job.label || job.name });
    }
  }

  function start(url) {
    const job = { id: uid(), url, user, kind: "file", name: nameFromUrl(url), done: 0, total: 0, speed: 0, ctrl: new AbortController() };
    const g = github(url);
    if (/^magnet:/i.test(url)) { handOff(url); job.done = 0; jobs.set(job.id, job); return finish(job, "handed", { name: "magnet link" }); }
    jobs.set(job.id, job);
    if (g && g.kind === "tree") { job.kind = "github"; job.name = g.repo; downloadGithubFolder(job, g); }
    else if (g && g.kind === "blob") downloadFile(job, `https://raw.githubusercontent.com/${g.owner}/${g.repo}/${g.rest}`);
    else if (g) { job.kind = "github"; job.name = g.repo + ".zip"; const z = `https://github.com/${g.owner}/${g.repo}/archive/HEAD.zip`; handOff(z); finish(job, "handed", { directUrl: z }); }
    else downloadFile(job, url);
  }

  // ---------- people (kept on this device)
  function renderPeople() {
    $("peopleList").innerHTML = people.map((p) =>
      `<button class="${p === user ? "on" : ""}" data-person="${esc(p)}">👤 ${bdi(p)}</button>`).join("");
    $("personName").textContent = user;
    $("personBtn").classList.toggle("hidden", !user);
  }
  function setUser(name) { user = name; store.set("user", name); renderPeople(); $("whoCard").classList.add("hidden"); renderWhoFilter(); }
  $("personBtn").onclick = () => { renderPeople(); $("whoCard").classList.toggle("hidden"); };
  $("peopleList").addEventListener("click", (e) => { const b = e.target.closest("button[data-person]"); if (b) setUser(b.dataset.person); });
  $("addPerson").onclick = () => {
    const name = $("newPerson").value.trim().slice(0, 40); if (!name) return;
    if (!people.some((p) => p.toLowerCase() === name.toLowerCase())) { people.push(name); store.setJSON("people", people); }
    $("newPerson").value = ""; setUser(name);
  };
  $("newPerson").addEventListener("keydown", (e) => { if (e.key === "Enter") $("addPerson").click(); });

  // ---------- add
  $("pasteBtn").onclick = async () => {
    try { const s = await navigator.clipboard.readText(); if (s) $("urls").value = ($("urls").value ? $("urls").value + "\n" : "") + s.trim(); }
    catch (e) { toast(t("pasteManual")); }
  };
  $("addBtn").onclick = () => {
    const urls = $("urls").value.split(/\s+/).map((s) => s.trim()).filter(Boolean);
    if (!urls.length) return toast(t("pasteFirst"));
    if (!user) { renderPeople(); $("whoCard").classList.remove("hidden"); return toast(t("pickWho")); }
    let started = 0, openedCobalt = false;
    for (const u of urls) {
      if (!/^(https?:\/\/|magnet:)/i.test(u)) { toast(t("notLink", { u })); continue; }
      if (isVideoSite(u)) {
        // the first one opens right away (needs the tap); the rest wait in History
        if (!openedCobalt) { openCobalt(u); openedCobalt = true; toast(t("videoSite")); }
        history.unshift({ id: uid(), kind: "video", name: u, url: u, user, status: "cobalt", size: 0, time: Date.now() });
        saveHistory(); started++; continue;
      }
      start(u); started++;
    }
    if (started) { $("urls").value = ""; showTab(jobs.size ? "active" : "history"); }
  };

  // ---------- tabs
  function showTab(name) {
    tab = name;
    $("tabActive").classList.toggle("on", name === "active");
    $("tabHistory").classList.toggle("on", name === "history");
    $("activeList").classList.toggle("hidden", name !== "active");
    $("historyBox").classList.toggle("hidden", name !== "history");
    render();
  }
  $("tabActive").onclick = () => showTab("active");
  $("tabHistory").onclick = () => showTab("history");

  // ---------- render
  let rafPending = false;
  function render() {
    if (rafPending) return; rafPending = true;
    requestAnimationFrame(() => { rafPending = false; renderActive(); if (tab === "history") renderHistory(); });
  }
  function renderActive() {
    const items = [...jobs.values()];
    $("activeCount").textContent = items.length ? `(${items.length})` : "";
    if (!items.length) { $("activeList").innerHTML = `<div class="empty">${t("nothingActive")}</div>`; return; }
    $("activeList").innerHTML = items.map((j) => {
      const pct = j.total ? Math.min(100, (j.done / j.total) * 100) : 0;
      const parts = [];
      if (j.zipping) parts.push(t("zipping"));
      else if (j.filesTotal) parts.push(t("files", { a: j.filesDone, b: j.filesTotal }));
      if (j.total) parts.push(`<bdi>${t("of", { a: size(j.done) || "0 B", b: size(j.total) })}</bdi> · ${pct.toFixed(0)}%`);
      else if (j.done) parts.push(`<bdi>${size(j.done)}</bdi>`);
      if (j.speed && !j.zipping) parts.push(`<bdi>${size(j.speed)}/s</bdi>`);
      return `<div class="item">
        <div class="name">${KIND[j.kind] || ""} ${bdi(j.label || j.name)}</div>
        <div class="bar ${!j.total ? "indet" : ""}"><i style="width:${pct}%"></i></div>
        <div class="meta"><span>${parts.join(" · ") || t("starting")}</span>${j.user ? `<span class="chip">${bdi(j.user)}</span>` : ""}</div>
        <div class="actions"><button class="small" data-cancel="${esc(j.id)}">${t("cancel")}</button></div></div>`;
    }).join("");
  }
  $("activeList").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-cancel]"); if (!b) return;
    const j = jobs.get(b.dataset.cancel); if (j) j.ctrl.abort();
  });

  function renderWhoFilter() {
    const sel = $("who"), cur = sel.value || store.get("who", "all");
    const names = [...new Set(people.concat(history.map((h) => h.user).filter(Boolean)))];
    sel.innerHTML = `<option value="all">${esc(t("everyone"))}</option>` + names.map((p) => `<option value="${esc(p)}">👤 ${esc(p)}</option>`).join("");
    sel.value = names.includes(cur) ? cur : "all";
  }
  function renderHistory() {
    const q = $("search").value.trim().toLowerCase(), who = $("who").value;
    const list = history.filter((h) => (who === "all" || h.user === who) &&
      (!q || (h.name + " " + h.url + " " + (h.user || "")).toLowerCase().includes(q)));
    if (!list.length) { $("historyList").innerHTML = `<div class="empty">${t(history.length ? "noMatch" : "noHistory")}</div>`; return; }
    const st = { done: ["status-done", "done"], handed: ["status-paused", "handed"], cobalt: ["status-paused", "viaCobalt"], error: ["status-error", "failed"] };
    $("historyList").innerHTML = list.slice(0, 300).map((h) => {
      const [cls, key] = st[h.status] || st.error;
      return `<div class="item">
      <div class="name">${KIND[h.kind] || ""} ${bdi(h.name)}</div>
      <div class="meta"><span class="${cls}">${t(key)}</span><span>${esc(when(h.time))}</span>
        ${h.size ? `<bdi>${size(h.size)}</bdi>` : ""}${h.user ? `<span class="chip">${bdi(h.user)}</span>` : ""}</div>
      ${h.status === "handed" ? `<div class="meta">${t("handedNote")}</div>` : ""}
      ${h.status === "cobalt" ? `<div class="meta">${t("cobaltNote")}</div>` : ""}
      ${h.error ? `<div class="meta status-error"><bdi>${esc(h.error)}</bdi></div>` : ""}
      <div class="actions">
        ${h.status === "cobalt" ? `<button class="small primary" data-cobalt="${esc(h.url)}">${t("cobalt")}</button>` : h.status === "handed" ? `<button class="small primary" data-open="${esc(h.directUrl || h.url)}">${t("openBrowser")}</button>` : `<button class="small" data-again="${esc(h.url)}">${t("again")}</button>`}
        <button class="small" data-copy="${esc(h.url)}">${t("copy")}</button>
        <button class="small" data-forget="${esc(h.id)}">${t("forget")}</button>
      </div></div>`;
    }).join("");
  }
  $("search").addEventListener("input", renderHistory);
  $("who").addEventListener("change", () => { store.set("who", $("who").value); renderHistory(); });
  $("historyList").addEventListener("click", async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.copy) {
      try { await navigator.clipboard.writeText(b.dataset.copy); toast(t("linkCopied")); } catch (err) { toast(b.dataset.copy); }
    } else if (b.dataset.open) { handOff(b.dataset.open);
    } else if (b.dataset.cobalt) { openCobalt(b.dataset.cobalt);
    } else if (b.dataset.again) { start(b.dataset.again); showTab("active"); }
    else if (b.dataset.forget) { history = history.filter((h) => h.id !== b.dataset.forget); saveHistory(); renderHistory(); }
  });
  $("clearHistory").onclick = () => { if (confirm(t("clearQ"))) { history = []; saveHistory(); renderHistory(); } };

  // ---------- language
  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = t("app");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
    $("langBtn").textContent = lang === "ar" ? "EN" : "ع";
    renderWhoFilter(); render();
  }
  $("langBtn").onclick = () => { lang = lang === "ar" ? "en" : "ar"; store.set("lang", lang); applyLang(); };

  // Warn before closing while something is downloading in the page
  window.addEventListener("beforeunload", (e) => { if (jobs.size) { e.preventDefault(); e.returnValue = ""; } });

  // ---------- start
  applyLang();
  renderPeople();
  if (!user) $("whoCard").classList.remove("hidden");
  const params = new URLSearchParams(location.search);
  const m = (params.get("url") || params.get("text") || "").match(/(https?:\/\/|magnet:)\S+/i);
  if (m) $("urls").value = m[0];
})();
</script>
</body>
</html>
