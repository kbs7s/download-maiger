<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Download maniger</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Downloads">
<style>
:root {
  --bg: #f4f6fb; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
  --accent: #2563eb; --accent-text: #ffffff; --ok: #16a34a; --bad: #dc2626; --warn: #d97706;
  --bar: #e5e7eb; --chip: #eef2ff; --chip-text: #3730a3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1020; --card: #151b2e; --text: #e5e7eb; --muted: #9ca3af; --line: #263049;
    --accent: #3b82f6; --bar: #263049; --chip: #1e2a4a; --chip-text: #c7d2fe;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, Arial, sans-serif; }
body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.wrap { max-width: 760px; margin: 0 auto; padding: 12px 16px 48px; }
header { display: flex; align-items: center; gap: 10px; padding: 6px 0 12px; }
header h1 { font-size: 20px; margin: 0; flex: 1; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 10px; padding: 8px 12px; cursor: pointer; text-decoration: none; display: inline-flex;
  align-items: center; gap: 6px; min-height: 40px; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.small, .btn.small { min-height: 34px; padding: 4px 10px; font-size: 14px; }
button:disabled { opacity: .5; cursor: default; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
textarea, input, select { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); }
textarea { min-height: 76px; resize: vertical; }
label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: 1; min-width: 240px; }
.seg button { border: 0; border-radius: 0; flex: 1; min-height: 40px; padding: 6px 4px; font-size: 14px; }
.seg button + button { border-inline-start: 1px solid var(--line); }
.seg button.on { background: var(--chip); color: var(--chip-text); font-weight: 600; }
.tabs { display: flex; gap: 8px; margin: 18px 0 10px; }
.tabs button { flex: 1; }
.tabs button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.item { padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 0; }
.name { font-weight: 600; word-break: break-word; }
.meta { color: var(--muted); font-size: 14px; display: flex; gap: 6px 10px; flex-wrap: wrap; margin-top: 2px; }
.chip { background: var(--chip); color: var(--chip-text); border-radius: 999px; padding: 0 8px; font-size: 13px; }
.bar { height: 8px; background: var(--bar); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.bar.indet > i { width: 30%; animation: slide 1.2s infinite ease-in-out; }
@keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
.status-error { color: var(--bad); } .status-done { color: var(--ok); } .status-paused { color: var(--warn); }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.hidden { display: none !important; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; max-width: calc(100% - 32px);
  font-size: 15px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 10; }
#toast.show { opacity: 1; }
.note { font-size: 14px; color: var(--muted); }
.warn { color: var(--warn); }
.filters { display: flex; gap: 8px; margin-bottom: 10px; }
.filters input { flex: 1; } .filters select { width: auto; }
code { background: var(--bg); padding: 1px 5px; border-radius: 6px; font-size: 14px; }
.person { font-weight: 600; }
.people { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.people button { border-radius: 999px; }
.people button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
[dir="rtl"] body, [dir="rtl"] input, [dir="rtl"] textarea, [dir="rtl"] select, [dir="rtl"] button {
  font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", "Geeza Pro", system-ui, sans-serif; }
#urls { direction: ltr; text-align: start; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i18n="app">Download maniger</h1>
    <span class="dot" id="dot"></span>
    <button id="langBtn" class="small" aria-label="Language">ع</button>
    <button id="personBtn" class="small person hidden">👤 <span id="personName"></span></button>
    <button id="settingsBtn" class="small" aria-label="Settings">⚙️</button>
  </header>

  <!-- Settings -->
  <section class="card hidden" id="settings">
    <strong data-i18n="connectTitle"></strong>
    <p class="note" data-i18n-html="connectHelp"></p>
    <label for="sServer" data-i18n="pcAddress"></label>
    <input id="sServer" type="url" inputmode="url" placeholder="https://my-pc.tail1234.ts.net" autocomplete="off" dir="ltr">
    <label for="sSecret" data-i18n="secret"></label>
    <input id="sSecret" type="password" autocomplete="off" dir="ltr">
    <p class="note warn hidden" id="mixedWarn" data-i18n="mixedWarn"></p>
    <div class="row end" style="margin-top:12px">
      <button id="sCancel" data-i18n="close"></button>
      <button id="sSave" class="primary" data-i18n="saveConnect"></button>
    </div>
  </section>

  <!-- Who is using this device -->
  <section class="card hidden" id="whoCard">
    <strong data-i18n="whoTitle"></strong>
    <div class="people" id="peopleList"></div>
    <div class="row">
      <input id="newPerson" type="text" maxlength="40" data-i18n-ph="newPersonPh" style="flex:1;min-width:160px">
      <button id="addPerson" class="primary" data-i18n="addPerson"></button>
    </div>
  </section>

  <!-- Add -->
  <section class="card" id="addCard">
    <label for="urls" style="margin-top:0" data-i18n="pasteLabel"></label>
    <textarea id="urls" placeholder="https://..." autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    <div class="row" style="margin-top:10px">
      <div class="seg" id="mode" role="group">
        <button data-mode="auto" class="on" data-i18n="mAuto"></button>
        <button data-mode="video" data-i18n="mVideo"></button>
        <button data-mode="audio" data-i18n="mAudio"></button>
        <button data-mode="file" data-i18n="mFile"></button>
      </div>
    </div>
    <div class="row end" style="margin-top:10px">
      <button id="pasteBtn" data-i18n="paste"></button>
      <button id="addBtn" class="primary" data-i18n="download"></button>
    </div>
    <p class="note" id="modeHelp"></p>
  </section>

  <div class="tabs">
    <button id="tabActive" class="on"><span data-i18n="tabActive"></span> <span id="activeCount"></span></button>
    <button id="tabHistory" data-i18n="tabHistory"></button>
  </div>

  <section class="card" id="activeList"></section>

  <section id="historyBox" class="hidden">
    <div class="filters">
      <input id="search" type="search" data-i18n-ph="search">
      <select id="who"></select>
    </div>
    <div class="card" id="historyList"></div>
  </section>
</div>
<div id="toast" role="status"></div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("dm." + k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("dm." + k, v); } catch (e) {} },
  };

  // ---------- translations
  const T = {
    en: {
      app: "Download maniger",
      connectTitle: "Connect to the home PC",
      connectHelp: "Ask whoever set up the PC for the address and secret token. On the PC itself use <code>http://localhost:6801</code>. On phones use the Tailscale address, like <code>https://my-pc.tail1234.ts.net</code>.",
      pcAddress: "PC address", secret: "Secret token", close: "Close", saveConnect: "Save and connect",
      mixedWarn: "This page is https, so the PC address must start with https:// (Tailscale gives you one), unless it is localhost.",
      whoTitle: "Who is using this device?", newPersonPh: "New name", addPerson: "Add",
      pasteLabel: "Paste one or more links (one per line)",
      mAuto: "Auto", mVideo: "🎬 Video", mAudio: "🎵 MP3", mFile: "📦 File",
      paste: "📋 Paste", download: "⬇️ Download",
      hAuto: "Auto: video sites (YouTube, Instagram, TikTok…) download as video, GitHub folders as a zip, everything else as a file.",
      hVideo: "Video: best quality up to 1080p, saved as MP4.",
      hAudio: "MP3: only the sound, good for songs and lectures.",
      hFile: "File: direct links to zip, exe, photos, PDFs, torrents (magnet links), GitHub files and folders…",
      tabActive: "Downloading", tabHistory: "History", search: "Search history",
      everyone: "Everyone",
      nothingActive: "Nothing downloading right now.", noHistory: "No downloads yet.", noMatch: "Nothing matches.",
      of: "{a} of {b}", starting: "Starting…", waiting: "Waiting", paused: "Paused",
      pause: "⏸ Pause", resume: "▶️ Resume", cancel: "✖ Cancel", cancelQ: "Cancel this download?",
      done: "✓ Done", failed: "✗ Failed", save: "📲 Save to this device", copy: "🔗 Copy link",
      retry: "↻ Try again", forget: "🗑 Remove from list", forgetQ: "Remove from the history list? The file stays on the PC.",
      linkCopied: "Link copied", startedAgain: "Started again", connected: "Connected ✓",
      started: "Started {n} download(s)", notLinks: "{n} not a link", noLink: "That doesn't look like a link.",
      pasteFirst: "Paste a link first.", pasteManual: "Long-press the box and choose Paste.",
      needServer: "Open Settings and enter the PC address.",
      unreachable: "Can't reach the PC. Is it on and is start.bat running?",
      pickWho: "Choose who you are first.",
      dotOk: "Connected to the PC", dotBad: "Not connected",
    },
    ar: {
      app: "مدير التنزيلات",
      connectTitle: "الاتصال بكمبيوتر البيت",
      connectHelp: "اطلب العنوان والرمز السري من الشخص الذي جهّز الكمبيوتر. على الكمبيوتر نفسه استخدم <code>http://localhost:6801</code>. على الهاتف استخدم عنوان Tailscale مثل <code>https://my-pc.tail1234.ts.net</code>.",
      pcAddress: "عنوان الكمبيوتر", secret: "الرمز السري", close: "إغلاق", saveConnect: "حفظ واتصال",
      mixedWarn: "هذه الصفحة آمنة (https)، لذلك يجب أن يبدأ عنوان الكمبيوتر بـ https:// (يعطيك Tailscale واحداً)، إلا إذا كان localhost.",
      whoTitle: "من يستخدم هذا الجهاز؟", newPersonPh: "اسم جديد", addPerson: "إضافة",
      pasteLabel: "الصق رابطاً أو أكثر (رابط في كل سطر)",
      mAuto: "تلقائي", mVideo: "🎬 فيديو", mAudio: "🎵 MP3", mFile: "📦 ملف",
      paste: "📋 لصق", download: "⬇️ تنزيل",
      hAuto: "تلقائي: مواقع الفيديو (يوتيوب، إنستغرام، تيك توك…) تُنزَّل كفيديو، ومجلدات GitHub كملف zip، وكل شيء آخر كملف.",
      hVideo: "فيديو: أفضل جودة حتى 1080p بصيغة MP4.",
      hAudio: "MP3: الصوت فقط، مناسب للأغاني والمحاضرات.",
      hFile: "ملف: روابط مباشرة لملفات zip و exe والصور و PDF والتورنت (روابط magnet) وملفات ومجلدات GitHub…",
      tabActive: "قيد التنزيل", tabHistory: "السجل", search: "ابحث في السجل",
      everyone: "الجميع",
      nothingActive: "لا يوجد شيء قيد التنزيل الآن.", noHistory: "لا توجد تنزيلات بعد.", noMatch: "لا توجد نتائج.",
      of: "{a} من {b}", starting: "جارٍ البدء…", waiting: "في الانتظار", paused: "متوقف مؤقتاً",
      pause: "⏸ إيقاف مؤقت", resume: "▶️ استئناف", cancel: "✖ إلغاء", cancelQ: "إلغاء هذا التنزيل؟",
      done: "✓ اكتمل", failed: "✗ فشل", save: "📲 حفظ على هذا الجهاز", copy: "🔗 نسخ الرابط",
      retry: "↻ إعادة المحاولة", forget: "🗑 حذف من القائمة", forgetQ: "حذف من السجل؟ يبقى الملف على الكمبيوتر.",
      linkCopied: "تم نسخ الرابط", startedAgain: "بدأ من جديد", connected: "تم الاتصال ✓",
      started: "بدأ {n} تنزيل", notLinks: "{n} ليس رابطاً", noLink: "هذا لا يبدو رابطاً.",
      pasteFirst: "الصق رابطاً أولاً.", pasteManual: "اضغط مطولاً على المربع واختر لصق.",
      needServer: "افتح الإعدادات وأدخل عنوان الكمبيوتر.",
      unreachable: "لا يمكن الوصول إلى الكمبيوتر. هل هو يعمل وهل start.bat مفتوح؟",
      pickWho: "اختر من أنت أولاً.",
      dotOk: "متصل بالكمبيوتر", dotBad: "غير متصل",
    },
  };
  let lang = store.get("lang", (navigator.language || "en").toLowerCase().startsWith("ar") ? "ar" : "en");
  function t(key, vars) {
    let s = (T[lang] && T[lang][key]) || T.en[key] || key;
    if (vars) for (const k in vars) s = s.replace("{" + k + "}", vars[k]);
    return s;
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = t("app");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
    $("langBtn").textContent = lang === "ar" ? "EN" : "ع";
    $("modeHelp").textContent = t({ auto: "hAuto", video: "hVideo", audio: "hAudio", file: "hFile" }[mode]);
    renderWhoFilter(); renderActive(lastItems); if (tab === "history") renderHistory();
  }

  let cfg = { server: store.get("server", ""), secret: store.get("secret", ""), user: store.get("user", "") };
  let mode = "auto", tab = "active", history = [], people = [], lastItems = [], timer = null, connected = false;

  // ---------- helpers
  function toast(msg) {
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove("show"), 3500);
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function size(n) {
    if (!n) return "";
    const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return n.toFixed(n < 10 && i ? 1 : 0) + " " + u[i];
  }
  function when(ts) {
    const d = new Date(ts * 1000), now = new Date(), loc = lang === "ar" ? "ar-IQ" : undefined;
    return d.toDateString() === now.toDateString()
      ? d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" })
      : d.toLocaleDateString(loc, { day: "numeric", month: "short", year: d.getFullYear() === now.getFullYear() ? undefined : "numeric" });
  }
  function normServer(s) {
    s = (s || "").trim().replace(/\/+$/, "");
    if (!s) return "";
    if (!/^https?:\/\//i.test(s)) s = (/^(localhost|127\.)/i.test(s) ? "http://" : "https://") + s;
    return s;
  }
  function isMixed(s) {
    return location.protocol === "https:" && /^http:\/\//i.test(s) && !/^http:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/i.test(s);
  }
  const KIND = { video: "🎬", audio: "🎵", file: "📦", github: "📁" };
  const bdi = (s) => `<bdi>${esc(s)}</bdi>`;

  async function api(path, body) {
    if (!cfg.server) throw new Error(t("needServer"));
    const opts = { headers: { "X-Secret": cfg.secret }, cache: "no-store" };
    if (body) { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    let r;
    try { r = await fetch(cfg.server + path, opts); }
    catch (e) { throw new Error(t("unreachable")); }
    let data = {};
    try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(data.error || ("Error " + r.status));
    return data;
  }
  function setConnected(ok) {
    connected = ok;
    $("dot").className = "dot " + (ok ? "ok" : "bad");
    $("dot").title = t(ok ? "dotOk" : "dotBad");
  }

  // ---------- language
  $("langBtn").onclick = () => { lang = lang === "ar" ? "en" : "ar"; store.set("lang", lang); applyLang(); };

  // ---------- settings
  function openSettings() {
    $("sServer").value = cfg.server; $("sSecret").value = cfg.secret;
    $("settings").classList.remove("hidden"); checkMixed();
  }
  function checkMixed() { $("mixedWarn").classList.toggle("hidden", !isMixed(normServer($("sServer").value))); }
  $("sServer").addEventListener("input", checkMixed);
  $("settingsBtn").onclick = () => $("settings").classList.contains("hidden") ? openSettings() : $("settings").classList.add("hidden");
  $("sCancel").onclick = () => $("settings").classList.add("hidden");
  $("sSave").onclick = async () => {
    cfg.server = normServer($("sServer").value); cfg.secret = $("sSecret").value.trim();
    store.set("server", cfg.server); store.set("secret", cfg.secret);
    try {
      await api("/api/info");
      setConnected(true); $("settings").classList.add("hidden"); toast(t("connected"));
      await loadPeople(); if (!cfg.user) openWho();
      refresh(true);
    } catch (e) { setConnected(false); toast(e.message); }
  };

  // ---------- people
  async function loadPeople() {
    try { people = (await api("/api/people")).people; } catch (e) { /* keep old list */ }
    renderPeople(); renderWhoFilter();
  }
  function renderPeople() {
    $("peopleList").innerHTML = people.map((p) =>
      `<button class="${p === cfg.user ? "on" : ""}" data-person="${esc(p)}">👤 ${bdi(p)}</button>`).join("");
    $("personName").textContent = cfg.user;
    $("personBtn").classList.toggle("hidden", !cfg.user);
  }
  function setUser(name) {
    cfg.user = name; store.set("user", name);
    renderPeople(); $("whoCard").classList.add("hidden"); renderWhoFilter();
  }
  function openWho() { renderPeople(); $("whoCard").classList.remove("hidden"); }
  $("personBtn").onclick = () => $("whoCard").classList.contains("hidden") ? (loadPeople(), openWho()) : $("whoCard").classList.add("hidden");
  $("peopleList").addEventListener("click", (e) => { const b = e.target.closest("button[data-person]"); if (b) setUser(b.dataset.person); });
  $("addPerson").onclick = async () => {
    const name = $("newPerson").value.trim(); if (!name) return;
    try { people = (await api("/api/people", { name })).people; } catch (e) { toast(e.message); return; }
    $("newPerson").value = ""; setUser(name);
  };
  $("newPerson").addEventListener("keydown", (e) => { if (e.key === "Enter") $("addPerson").click(); });

  // ---------- add
  $("mode").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    mode = b.dataset.mode;
    [...$("mode").children].forEach((x) => x.classList.toggle("on", x === b));
    $("modeHelp").textContent = t({ auto: "hAuto", video: "hVideo", audio: "hAudio", file: "hFile" }[mode]);
  });
  $("pasteBtn").onclick = async () => {
    try { const s = await navigator.clipboard.readText(); if (s) $("urls").value = ($("urls").value ? $("urls").value + "\n" : "") + s.trim(); }
    catch (e) { toast(t("pasteManual")); }
  };
  $("addBtn").onclick = async () => {
    const urls = $("urls").value.split(/\s+/).map((s) => s.trim()).filter(Boolean);
    if (!urls.length) return toast(t("pasteFirst"));
    if (!cfg.user) { openWho(); return toast(t("pickWho")); }
    $("addBtn").disabled = true;
    try {
      const r = await api("/api/add", { urls, mode, user: cfg.user });
      const bad = r.added.filter((a) => a.error).length, good = r.added.length - bad;
      toast(good ? t("started", { n: good }) + (bad ? " · " + t("notLinks", { n: bad }) : "") : t("noLink"));
      if (good) { $("urls").value = ""; showTab("active"); refresh(); }
    } catch (e) { toast(e.message); }
    finally { $("addBtn").disabled = false; }
  };

  // ---------- tabs
  function showTab(name) {
    tab = name;
    $("tabActive").classList.toggle("on", name === "active");
    $("tabHistory").classList.toggle("on", name === "history");
    $("activeList").classList.toggle("hidden", name !== "active");
    $("historyBox").classList.toggle("hidden", name !== "history");
    if (name === "history") loadHistory();
  }
  $("tabActive").onclick = () => showTab("active");
  $("tabHistory").onclick = () => showTab("history");

  // ---------- active list
  function renderActive(items) {
    $("activeCount").textContent = items.length ? `(${items.length})` : "";
    if (!items.length) { $("activeList").innerHTML = `<div class="empty">${esc(lastError || t("nothingActive"))}</div>`; return; }
    $("activeList").innerHTML = items.map((it) => {
      if (it.kind === "error") return `<div class="item status-error">${esc(it.name)}</div>`;
      const pct = it.total ? Math.min(100, (it.done / it.total) * 100) : 0;
      const parts = [];
      if (it.total) parts.push(`<bdi>${t("of", { a: size(it.done) || "0 B", b: size(it.total) })}</bdi> · ${pct.toFixed(0)}%`);
      else if (it.done) parts.push(`<bdi>${size(it.done)}</bdi>`);
      if (it.speed && it.status === "active") parts.push(`<bdi>${size(it.speed)}/s</bdi>`);
      const label = it.status === "active" ? "" : (t(it.status) || it.status);
      const isFile = it.kind === "file";
      return `<div class="item">
        <div class="name">${KIND[it.kind] || ""} ${bdi(it.name)}</div>
        <div class="bar ${!it.total && it.status === "active" ? "indet" : ""}"><i style="width:${pct}%"></i></div>
        <div class="meta">${label ? `<span class="status-paused">${esc(label)}</span>` : ""}
          <span>${parts.join(" · ") || t("starting")}</span>${it.user ? `<span class="chip">${bdi(it.user)}</span>` : ""}</div>
        <div class="actions">
          ${isFile && it.status === "active" ? `<button class="small" data-act="pause" data-id="${esc(it.id)}">${t("pause")}</button>` : ""}
          ${isFile && it.status === "paused" ? `<button class="small" data-act="resume" data-id="${esc(it.id)}">${t("resume")}</button>` : ""}
          <button class="small" data-act="remove" data-id="${esc(it.id)}">${t("cancel")}</button>
        </div></div>`;
    }).join("");
  }
  $("activeList").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    if (b.dataset.act === "remove" && !confirm(t("cancelQ"))) return;
    b.disabled = true;
    try { await api("/api/action", { id: b.dataset.id, action: b.dataset.act }); refresh(); }
    catch (err) { toast(err.message); b.disabled = false; }
  });

  // ---------- history
  function renderWhoFilter() {
    const sel = $("who"), cur = sel.value || store.get("who", "all");
    const names = [...new Set(people.concat(history.map((h) => h.user).filter(Boolean)))];
    sel.innerHTML = `<option value="all">${esc(t("everyone"))}</option>` +
      names.map((p) => `<option value="${esc(p)}">👤 ${esc(p)}</option>`).join("");
    sel.value = names.includes(cur) ? cur : "all";
  }
  async function loadHistory() {
    try { history = (await api("/api/history")).items; renderWhoFilter(); renderHistory(); setConnected(true); }
    catch (e) { setConnected(false); $("historyList").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  function fileUrl(h) {
    return cfg.server + "/files/" + h.path.split("/").map(encodeURIComponent).join("/") + "?token=" + encodeURIComponent(cfg.secret);
  }
  function renderHistory() {
    const q = $("search").value.trim().toLowerCase(), who = $("who").value;
    const list = history.filter((h) =>
      (who === "all" || (h.user || "") === who) &&
      (!q || (h.name + " " + h.url + " " + (h.user || "")).toLowerCase().includes(q)));
    if (!list.length) { $("historyList").innerHTML = `<div class="empty">${t(history.length ? "noMatch" : "noHistory")}</div>`; return; }
    $("historyList").innerHTML = list.slice(0, 300).map((h) => `<div class="item">
      <div class="name">${KIND[h.kind] || ""} ${bdi(h.name)}</div>
      <div class="meta">
        <span class="status-${h.status === "done" ? "done" : "error"}">${t(h.status === "done" ? "done" : "failed")}</span>
        <span>${esc(when(h.time))}</span>${h.size ? `<bdi>${size(h.size)}</bdi>` : ""}
        ${h.user ? `<span class="chip">${bdi(h.user)}</span>` : ""}</div>
      ${h.error ? `<div class="meta status-error"><bdi>${esc(h.error)}</bdi></div>` : ""}
      <div class="actions">
        ${h.status === "done" && h.path ? `<a class="btn small" href="${esc(fileUrl(h))}" target="_blank" rel="noopener">${t("save")}</a>` : ""}
        ${h.url ? `<button class="small" data-copy="${esc(h.url)}">${t("copy")}</button>` : ""}
        ${h.status !== "done" && h.url ? `<button class="small" data-retry="${esc(h.url)}" data-kind="${esc(h.kind)}">${t("retry")}</button>` : ""}
        <button class="small" data-forget="${esc(h.id)}">${t("forget")}</button>
      </div></div>`).join("");
  }
  $("search").addEventListener("input", renderHistory);
  $("who").addEventListener("change", () => { store.set("who", $("who").value); renderHistory(); });
  $("historyList").addEventListener("click", async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.copy) {
      try { await navigator.clipboard.writeText(b.dataset.copy); toast(t("linkCopied")); } catch (err) { toast(b.dataset.copy); }
    } else if (b.dataset.retry) {
      const k = b.dataset.kind, m = k === "video" || k === "audio" ? k : "auto";
      try { await api("/api/add", { urls: [b.dataset.retry], mode: m, user: cfg.user }); toast(t("startedAgain")); showTab("active"); refresh(); }
      catch (err) { toast(err.message); }
    } else if (b.dataset.forget) {
      if (!confirm(t("forgetQ"))) return;
      try { await api("/api/action", { id: "h-" + b.dataset.forget, action: "remove" }); history = history.filter((h) => h.id !== b.dataset.forget); renderHistory(); }
      catch (err) { toast(err.message); }
    }
  });

  // ---------- polling
  let lastActiveIds = "", lastError = "";
  async function refresh(force) {
    clearTimeout(timer);
    if (cfg.server && cfg.secret) {
      try {
        const items = (await api("/api/active")).items;
        lastError = ""; lastItems = items; renderActive(items); setConnected(true);
        const ids = items.map((i) => i.id).join(",");
        if ((ids !== lastActiveIds || force) && tab === "history") loadHistory();
        lastActiveIds = ids;
      } catch (e) {
        setConnected(false); lastError = e.message; lastItems = []; renderActive([]);
      }
    }
    timer = setTimeout(refresh, document.hidden ? 15000 : 1500);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

  // ---------- start
  applyLang();
  const params = new URLSearchParams(location.search);
  const shared = params.get("url") || params.get("text") || "";
  const m = shared.match(/(https?:\/\/|magnet:)\S+/i);
  if (m) $("urls").value = m[0];
  if (!cfg.server || !cfg.secret) { openSettings(); $("dot").className = "dot"; }
  else loadPeople().then(() => { if (!cfg.user) openWho(); });
  refresh(true);
})();
</script>
</body>
</html>
