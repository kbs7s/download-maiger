# Download maniger bot: the bot + a local Telegram Bot API server (lets it send files up to 2 GB)
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - api-data:/var/lib/telegram-bot-api
      - ./data:/data            # same path in both containers, so the server can read the bot's files

  bot:
    build: .
    restart: unless-stopped
    depends_on: [telegram-bot-api]
    env_file: .env
    environment:
      API_BASE: http://telegram-bot-api:8081
      DATA_DIR: /data
    volumes:
      - ./data:/data

volumes:
  api-data:
